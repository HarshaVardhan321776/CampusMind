services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ALLOWED_ORIGINS=*
    volumes:
      - campusmind_data:/app/Backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - CAMPUSMIND_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  campusmind_data:

