services:
  # FastAPI Backend API
  - type: web
    name: campusmind-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false

  # Streamlit Frontend Web UI
  - type: web
    name: campusmind-frontend
    env: python
    rootDir: Frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run App.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CAMPUSMIND_API_URL
        fromService:
          type: web
          name: campusmind-backend
          property: host

